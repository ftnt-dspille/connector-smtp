[project]
name = "connector-smtp"
version = "3.0.0"
description = "FortiSOAR SMTP connector — stdlib smtplib, pydantic-validated, structured results."
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["pydantic>=2.0", "beautifulsoup4>=4.11", "jinja2>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "aiosmtpd>=1.4", "python-dotenv>=1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
