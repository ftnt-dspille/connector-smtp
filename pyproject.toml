[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Only the connector package is installable; harness/ and tests/ are dev-only,
# so disable setuptools' flat-layout auto-discovery (which trips on them).
packages = ["smtp_ng"]

[project]
name = "connector-smtp-ng"
version = "1.0.0"
description = "FortiSOAR SMTP (Next-Gen) connector — stdlib smtplib, pydantic-validated, structured results."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pydantic>=2.0", "beautifulsoup4>=4.11", "jinja2>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "aiosmtpd>=1.4", "python-dotenv>=1.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on sys.path so `from tests.conftest import ...` resolves
# regardless of how pytest is invoked (bare `pytest` vs `python -m pytest`).
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, pyupgrade, bugbear
select = ["F", "E", "W", "I", "UP", "B"]
